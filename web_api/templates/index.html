<!-- templates/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Call Automation - Client Selection</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <style>
        /* ==============================
   DARK THEME OVERRIDE
   ============================== */
body {
    background: #121212;
    color: #e0e0e0;
}

.navbar {
    background: #0f172a !important;
}

.card {
    background: #1e1e1e;
    color: #e0e0e0;
    border: 1px solid #2d2d2d;
}

.table thead th {
    background: #0f172a !important;
    color: #f8fafc;
}

.table tbody td {
    color: #e0e0e0;
    border-color: #2d2d2d;
}

.table-hover tbody tr:hover {
    background: #2d2d2d;
}

.btn-light {
    background: #2d2d2d;
    color: #f8fafc;
}

.btn-outline-light {
    border-color: #f8fafc;
    color: #f8fafc;
}

    </style>
</head>

<body>

<!-- Navigation Bar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="#">Call Automation</a>

        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/">Client List</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/dashboard">Dashboard</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- Client List -->
<div class="container mt-4">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">
            Client List
        </div>

        <div class="card-body">

            <!-- Select All -->
            <div class="form-check mb-3">
                <input
                        class="form-check-input"
                        type="checkbox"
                        id="select-all">

                <label
                        class="form-check-label fw-bold"
                        for="select-all">
                    Select All Clients
                </label>
            </div>

            <form method="post" action="/login">

                <table class="table table-striped table-hover">

                    <thead class="table-dark">
                    <tr>
                        <th>Client ID</th>
                        <th>Enable</th>
                        <th>Lots</th>
                    </tr>
                    </thead>

                    <tbody>

                    {% for client in clients %}
                    <tr>

    <td>{{ client.client_id }}</td>

    <td>
        <input
            type="checkbox"
            class="client-toggle"
            data-client="{{ client.client_id }}"
            {% if client.client_id in enabled_set %}
            checked
            {% endif %}
        >
    </td>

    <td style="width:120px;">
        <input
            type="number"
            min="1"
            step="1"
            class="form-control lot-input"
            data-client="{{ client.client_id }}"
            value="{{ client.lots if client.lots else 1 }}">
    </td>

</tr>
                    {% endfor %}

                    </tbody>

                </table>

                <button
                        type="submit"
                        class="btn btn-success w-100 mt-3">
                    Login Enabled Clients
                </button>

            </form>

        </div>

    </div>

</div>

<!-- JavaScript -->
<script>

    // Individual client toggle

    document.querySelectorAll('.client-toggle')
        .forEach(cb => {

            cb.addEventListener('change', function () {

                fetch('/toggle_client', {

                    method: 'POST',

                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },

                    body:
                        'client_id=' +
                        this.dataset.client +
                        '&enabled=' +
                        this.checked

                });

            });

        });


    // Select All

    document.getElementById('select-all')
        .addEventListener('change', function () {

            const checked = this.checked;

            document.querySelectorAll('.client-toggle')
                .forEach(cb => {

                    cb.checked = checked;

                    fetch('/toggle_client', {

                        method: 'POST',

                        headers: {
                            'Content-Type': 'application/x-www-form-urlencoded'
                        },

                        body:
                            'client_id=' +
                            cb.dataset.client +
                            '&enabled=' +
                            checked

                    });

                });

        });
    // Lots update

document.querySelectorAll('.lot-input')
    .forEach(input => {

        input.addEventListener('change', function () {

            let lots = parseInt(this.value);

            if (isNaN(lots) || lots < 1) {
                lots = 1;
                this.value = 1;
            }

            fetch('/update_lots', {

                method: 'POST',

                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                },

                body:
                    'client_id=' +
                    this.dataset.client +
                    '&lots=' +
                    lots

            });

        });

    });
</script>

</body>
</html>
